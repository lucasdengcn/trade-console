name: Cross-Platform Build

on:
  push:
    branches: [main, develop]
    paths:
      - "trade-manager/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "trade-manager/**"
      - ".github/workflows/**"
  release:
    types: [published]

env:
  PROJECT_NAME: trade-manager
  BINARY_NAME: trade-cli
  VERSION: ${{ github.ref_name }}

jobs:
  # Build for multiple platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: trade-cli-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: trade-cli-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: trade-cli-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: trade-cli-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: trade-cli-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: true

      - name: Verify Go version
        run: |
          echo "Go version:"
          go version

      - name: Download dependencies
        run: go mod download
        working-directory: trade-manager

      - name: Verify dependencies
        run: go mod verify
        working-directory: trade-manager

      - name: Build binary (Linux/macOS)
        if: matrix.goos != 'windows'
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
          -ldflags="-s -w -X main.version=${{ env.VERSION }}" \
          -o ${{ matrix.artifact_name }} \
          cmd/cli/main.go
        working-directory: trade-manager

      - name: Build binary (Windows)
        if: matrix.goos == 'windows'
        run: |
          $env:GOOS="${{ matrix.goos }}"
          $env:GOARCH="${{ matrix.goarch }}"
          go build -ldflags="-s -w -X main.version=${{ env.VERSION }}" `
            -o ${{ matrix.artifact_name }} `
            cmd/cli/main.go
        working-directory: trade-manager
        shell: pwsh

      # - name: Test binary (Linux/macOS)
      #   if: matrix.goos != 'windows'
      #   run: |
      #     chmod +x ${{ matrix.artifact_name }}
      #     ./${{ matrix.artifact_name }} --version || ./${{ matrix.artifact_name }} --help
      #   working-directory: trade-manager

      # - name: Test binary (Windows)
      #   if: matrix.goos == 'windows'
      #   run: |
      #     .\${{ matrix.artifact_name }} --version || .\${{ matrix.artifact_name }} --help
      #   working-directory: trade-manager
      #   shell: pwsh

      - name: Show binary info (Linux/macOS)
        if: matrix.goos != 'windows'
        run: |
          echo "Binary information:"
          file "${{ matrix.artifact_name }}"
          echo "Binary size:"
          ls -lh "${{ matrix.artifact_name }}"
        working-directory: trade-manager

      - name: Show binary info (Windows)
        if: matrix.goos == 'windows'
        run: |
          echo "Binary information:"
          Get-Item "${{ matrix.artifact_name }}" | Format-List
          echo "File size:"
          (Get-Item "${{ matrix.artifact_name }}").Length
        working-directory: trade-manager
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: trade-manager/${{ matrix.artifact_name }}
          retention-days: 30

  # Create release with all binaries
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: ls -la

      - name: Create checksums
        run: |
          find . -name "trade-cli-*" -type f -exec sha256sum {} \; > checksums.txt
          echo "Checksums created:"
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            trade-cli-linux-amd64/trade-cli-linux-amd64
            trade-cli-linux-arm64/trade-cli-linux-arm64
            trade-cli-windows-amd64.exe/trade-cli-windows-amd64.exe
            trade-cli-darwin-amd64/trade-cli-darwin-amd64
            trade-cli-darwin-arm64/trade-cli-darwin-arm64
            checksums.txt
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            Cross-platform build of Trade Manager ${{ github.ref_name }}

            ## Supported Platforms
            - Linux (amd64, arm64)
            - Windows (amd64)
            - macOS (Intel, Apple Silicon)

            ## Usage
            Download the binary for your platform and make it executable:

            ```bash
            chmod +x trade-cli-<platform>
            ./trade-cli-<platform> --help
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
