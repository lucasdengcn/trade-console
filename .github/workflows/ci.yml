name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "trade-manager/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "trade-manager/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 2 * * 1" # Weekly on Monday at 2 AM

env:
  GO_VERSION: "1.21"
  PROJECT_NAME: trade-manager
  BINARY_NAME: trade-cli
  DOCKER_IMAGE: trade-manager

jobs:
  # Code quality and security checks
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go vet
        run: |
          cd trade-manager
          go vet ./...

      - name: Run static analysis with golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: trade-manager
          version: latest

      - name: Run security scan with gosec
        uses: securego/gosec@master
        with:
          working-directory: trade-manager
          args: "-exclude=G104,G204" # Exclude specific rules

      - name: Check for vulnerable dependencies
        uses: actions/dependency-review-action@v3

  # Unit tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: |
          cd trade-manager
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: trade-manager/coverage.out
          flags: unittests
          name: codecov-umbrella

  # Cross-platform builds
  build:
    name: Build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    needs: [quality, test]
    strategy:
      matrix:
        config:
          - name: Linux AMD64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: ${{ env.BINARY_NAME }}-linux-amd64
          - name: Linux ARM64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: ${{ env.BINARY_NAME }}-linux-arm64
          - name: Windows AMD64
            os: windows-latest
            goos: windows
            goarch: amd64
            artifact: ${{ env.BINARY_NAME }}-windows-amd64.exe
          - name: macOS Intel
            os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: ${{ env.BINARY_NAME }}-darwin-amd64
          - name: macOS Apple Silicon
            os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: ${{ env.BINARY_NAME }}-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          cd trade-manager
          GOOS=${{ matrix.config.goos }} GOARCH=${{ matrix.config.goarch }} \
          go build -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o ${{ matrix.config.artifact }} \
            cmd/cli/main.go

      - name: Test binary
        run: |
          cd trade-manager
          if [[ "${{ matrix.config.goos }}" != "windows" ]]; then
            chmod +x ${{ matrix.config.artifact }}
            ./${{ matrix.config.artifact }} --version || ./${{ matrix.config.artifact }} --help
          else
            # Windows doesn't need chmod
            ./${{ matrix.config.artifact }} --version || ./${{ matrix.config.artifact }} --help
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: trade-manager/${{ matrix.config.artifact }}
          retention-days: 30

  # Docker build
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trade-manager
          file: ./trade-manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trade-manager:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trade-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create checksums
        run: |
          find . -name "${{ env.BINARY_NAME }}-*" -type f -exec sha256sum {} \; > checksums.txt
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            trade-cli-linux-amd64/trade-cli-linux-amd64
            trade-cli-linux-arm64/trade-cli-linux-arm64
            trade-cli-windows-amd64.exe/trade-cli-windows-amd64.exe
            trade-cli-darwin-amd64/trade-cli-darwin-amd64
            trade-cli-darwin-arm64/trade-cli-darwin-arm64
            checksums.txt
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            # Trade Manager ${{ github.ref_name }}

            Cross-platform trading management tool for multi-account position synchronization.

            ## 📦 Downloads

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | Linux | AMD64 | [trade-cli-linux-amd64](trade-cli-linux-amd64) |
            | Linux | ARM64 | [trade-cli-linux-arm64](trade-cli-linux-arm64) |
            | Windows | AMD64 | [trade-cli-windows-amd64.exe](trade-cli-windows-amd64.exe) |
            | macOS | Intel | [trade-cli-darwin-amd64](trade-cli-darwin-amd64) |
            | macOS | Apple Silicon | [trade-cli-darwin-arm64](trade-cli-darwin-arm64) |

            ## 🔍 Verification

            Verify downloads using the checksums file:
            ```bash
            sha256sum -c checksums.txt
            ```

            ## 🚀 Quick Start

            ```bash
            # Make executable (Linux/macOS)
            chmod +x trade-cli-<platform>

            # Show help
            ./trade-cli-<platform> --help

            # Initialize configuration
            ./trade-cli-<platform> --init
            ```

            ## 🐳 Docker

            Also available as a Docker image:
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/trade-manager:latest
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
